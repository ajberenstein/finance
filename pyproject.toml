[project]
name = "yahoo-finance-mcp"
version = "0.1.0"
description = "MCP server for Yahoo Finance data via yfinance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "yfinance>=0.2.30",
    "pandas>=2.0.0",
]

[project.scripts]
yahoo-finance-mcp = "yahoo_finance_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yahoo_finance_mcp"]
