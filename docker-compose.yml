services:
  yahoo-finance-mcp:
    build: .
    environment:
      MCP_TRANSPORT: sse
      PORT: 8000
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    restart: unless-stopped
    depends_on:
      - yahoo-finance-mcp

volumes:
  caddy_data:
  caddy_config:
